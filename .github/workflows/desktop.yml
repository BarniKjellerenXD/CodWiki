name: CodWiki Desktop (Windows)

on:
  workflow_dispatch:
  push:
    paths:
      - "desktop-app/**"
      - "shared/**"
      - "scripts/generate-catalogue.mjs"
      - ".github/workflows/desktop.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install website build and test dependencies
        working-directory: .
        run: npm ci
      - name: Generate shared navigation
        working-directory: .
        run: node scripts/generate-catalogue.mjs
      - name: Check compatibility
        working-directory: .
        run: npm test
      - name: Install deps
        run: npm ci
      - name: Build installer + portable zip
        run: npm run dist:win
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(node -p "require('./package.json').version")
          TAG="desktop-v$VER"
          gh release create "$TAG" --title "CodWiki Desktop v$VER" \
            --target "$GITHUB_SHA" --notes-file RELEASE_NOTES.md \
            dist/*.exe dist/*.zip || gh release upload "$TAG" dist/*.exe dist/*.zip --clobber
